name = "gleam_pds"
version = "0.1.0"
target = "erlang"
description = "An AT Protocol Personal Data Server, written in Gleam on the BEAM."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.71.0 and < 1.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
wisp = ">= 2.2.0 and < 3.0.0"
mist = ">= 6.0.0 and < 7.0.0"
sqlight = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
marceau = ">= 1.3.0 and < 2.0.0"
youid = ">= 1.6.0 and < 2.0.0"
birl = ">= 2.0.0 and < 3.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
envoy = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
